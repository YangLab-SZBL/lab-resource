site_name: Lab Resource
site_description: Computing and bioinformatics resources for the lab
site_url: https://yanglab202606.github.io/lab-resource/
repo_url: https://github.com/yanglab202606/lab-resource
repo_name: yanglab202606/lab-resource
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    scheme: default
    primary: custom
    accent: custom
  icon:
    repo: material/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/extra.css

plugins:
  - search:
      lang:
        - en
        - zh

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - HPC:
      - Getting Started: hpc/getting-started.md
      - Slurm: hpc/slurm.md
      - Micromamba Environment: hpc/micromamba.md
  - Software:
      - DIA-NN: software/dia-nn.md
      - FragPipe: software/fragpipe.md
      - iFlow CLI: software/iflow-install.md
  - Workflows:
      - Proteomics: workflows/proteomics.md
  - Scripts: scripts/index.md
  - Troubleshooting: troubleshooting/common-errors.md
